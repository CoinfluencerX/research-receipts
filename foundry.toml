[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10_000
bytecode_hash = "none"   # reproducible bytecode for explorer verification

[fuzz]
runs = 1000

[profile.ci.fuzz]
runs = 5000

[rpc_endpoints]
# Official public endpoint from docs.robinhood.com/chain/connecting (rate-limited; fine for a few txs).
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
anvil = "http://127.0.0.1:8545"

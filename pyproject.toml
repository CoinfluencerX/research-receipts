[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-receipts"
version = "0.1.0"
description = "Commit-reveal track record of research calls on Robinhood Chain testnet"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
prices = ["yfinance>=0.2.40"]
dev = ["pytest>=8"]

[project.scripts]
receipts = "receipts.cli:main"

[tool.setuptools]
packages = ["receipts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
